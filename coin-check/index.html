<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>코인 5개 셀프체크</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f3e8d6;--paper:#fffdf6;--ink:#3b3228;--dim:#8a7b68;--line:#e2d3ba;--btn:#c9743d;--gold:#e8b23a}
html,body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
body{min-height:100dvh;display:flex;justify-content:center}
main{width:100%;max-width:460px;padding:20px 16px 32px}
h1{font-size:26px;line-height:1.3;font-weight:900}
.sub{font-size:17px;color:var(--dim);font-weight:700;margin-top:6px;line-height:1.5}
.lock{display:inline-block;background:#fff3d6;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:900;color:var(--btn);margin-bottom:10px}
.purse{position:sticky;top:0;z-index:2;background:var(--bg);padding:12px 0 8px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px}
.coins{display:flex;gap:6px}
.coin{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a6,var(--gold));border:3px solid #b98816;transition:transform .25s,opacity .25s}
.coin.used{opacity:.18;transform:scale(.8)}
.row{background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:14px;margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;transition:border-color .2s}
.row.has{border-color:var(--btn)}
.row h3{font-size:20px;font-weight:900}
.row p{font-size:15px;color:var(--dim);font-weight:700;margin-top:2px}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);background:#fff;font-size:26px;font-weight:900;color:var(--ink);line-height:1}
.ctl button:active{transform:scale(.9)}
.ctl button:disabled{opacity:.3}
.ctl b{min-width:26px;text-align:center;font-size:26px;font-weight:900}
.mini{grid-column:1/-1;display:flex;gap:4px;min-height:14px}
.mini i{width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid #b98816;animation:pop .3s}
.cta{width:100%;margin-top:16px;padding:16px;border:0;border-radius:18px;background:var(--btn);color:#fff;font-size:20px;font-weight:900;box-shadow:0 5px 0 #8f4f26}
.cta:disabled{background:#d8c9b1;box-shadow:none;color:#fff}
.ghost{width:100%;margin-top:10px;padding:13px;border:3px solid var(--line);border-radius:16px;background:var(--paper);font-size:17px;font-weight:900;color:var(--ink)}
.card{animation-fill-mode:both;background:var(--paper);border:4px solid var(--ink);border-radius:24px;padding:22px 18px;margin-top:14px;text-align:center;box-shadow:0 6px 0 #3b322822;animation:pop .5s}
.card .em{font-size:64px;line-height:1.1}
.card h2{font-size:26px;font-weight:900;margin-top:6px}
.card p{font-size:17px;font-weight:700;color:var(--dim);margin-top:8px;line-height:1.5}
.bar{display:grid;grid-template-columns:5.5em 1fr 2.6em;gap:8px;align-items:center;margin-top:9px;font-weight:900;font-size:16px;text-align:left}
.bar u{display:block;height:16px;border-radius:8px;background:#3b32280d;overflow:hidden;text-decoration:none}
.bar s{display:block;height:100%;background:var(--btn);border-radius:8px;transition:width .6s}
.q{background:#fff3d6;border-left:6px solid var(--btn);border-radius:8px;padding:10px 14px;margin-top:12px;font-size:17px;font-weight:800;line-height:1.5;text-align:left}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="s1">
  <span class="lock">🔒 내 폰에서만 보여요. 어디에도 전송되지 않습니다</span>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div class="purse"><span id="pl">남은 코인</span><div class="coins" id="coins"></div></div>
  <div id="rows"></div>
  <button class="cta" id="go" disabled></button>
</section>
<section id="s2" hidden>
  <span class="lock">🔒 이 결과는 나만 봅니다</span>
  <div id="cards"></div>
  <div class="card" style="text-align:left;padding:16px"><p style="margin:0;color:var(--ink);font-weight:900;font-size:17px">내 코인의 이동</p><div id="bars"></div><p id="mv" style="font-size:16px"></p></div>
  <div id="qs"></div>
  <button class="ghost" id="again">↺ 다시 해 보기</button>
</section>
</main>
<script>
const IT=[
 {e:'⏱',n:'속도',d:'빨리 끝내는 것',ty:'스피드 러너',up:'일이 눈앞에서 착착 줄어들 때',dn:'결정이 미뤄져서 기다려야 할 때',ask:'“언제까지인지 먼저 알려 주세요”',cl:'속도가 중요한 동료는 “왜 아직이야?” 하고 답답해할 수 있어요.'},
 {e:'✅',n:'확실함',d:'틀리지 않는 것',ty:'안전 점검관',up:'확인하고 또 확인해서 빈틈이 없을 때',dn:'확인할 틈도 없이 “일단 보내”라고 할 때',ask:'“어디까지 확정인지 먼저 알려 주세요”',cl:'확실함이 중요한 동료는 “확인은 했어?” 하고 불안해할 수 있어요.'},
 {e:'🤝',n:'사람',d:'함께하는 사람들의 마음',ty:'분위기 지킴이',up:'다 같이 으쌰으쌰 하며 갈 때',dn:'급하다고 말이 날카로워질 때',ask:'“급해도 한마디만 부드럽게 해 주세요”',cl:'사람이 중요한 동료는 급할 때의 내 말투에 서운할 수 있어요.'},
 {e:'✨',n:'완성도',d:'보기 좋게 다듬는 것',ty:'마감 장인',up:'결과물이 보기 좋게 딱 떨어질 때',dn:'덜 된 것을 그대로 내야 할 때',ask:'“어느 정도 완성도면 되는지 먼저 알려 주세요”',cl:'완성도가 중요한 동료는 “이대로 내도 돼?” 하고 마음에 걸려 할 수 있어요.'},
 {e:'🕊',n:'내 페이스',d:'쫓기지 않고 내 방식대로 하는 것',ty:'마이 페이스',up:'내 순서와 방식대로 할 수 있을 때',dn:'계속 재촉받고 중간에 끼어들 때',ask:'“맡겼으면 잠깐만 믿고 기다려 주세요”',cl:'자기 페이스가 중요한 동료는 내 재촉이 버겁게 느껴질 수 있어요.'}];
const N=5,CUT=2,$=s=>document.querySelector(s);
let v=IT.map(()=>0),v0=null,step=1;
const sum=()=>v.reduce((a,b)=>a+b,0);
function draw(){
  const left=step===1?N-sum():sum()-(N-CUT);
  $('#h1').innerHTML=step===1?'급한 일이 떨어졌을 때,<br>내가 끝까지 포기 못 하는 것은?':'⚡ 돌발! 시간이 반으로 줄었어요.<br>코인 2개를 내려놓으세요';
  $('#sub').textContent=step===1?'코인 5개를 나눠 주세요. 한곳에 몰아도, 골고루 나눠도 됩니다. 정답은 없어요.':'어디에서 뺄까요? 마지막까지 남는 것이 진짜 내가 지키는 것입니다.';
  $('#pl').textContent=step===1?'남은 코인':'내려놓을 코인';
  $('#coins').innerHTML=Array.from({length:step===1?N:CUT},(_,i)=>`<div class="coin ${i>=left?'used':''}"></div>`).join('');
  IT.forEach((_,i)=>{const r=$('#r'+i);r.classList.toggle('has',v[i]>0);r.querySelector('b').textContent=v[i];
    r.querySelector('.mini').innerHTML='<i></i>'.repeat(v[i]);
    r.querySelector('[data-d="-1"]').disabled=v[i]<=0||(step===2&&left<=0);
    const pl=r.querySelector('[data-d="1"]');pl.disabled=step===1?left<=0:v[i]>=v0[i];});
  const g=$('#go');g.disabled=left>0;
  g.textContent=step===1?(left>0?`코인 ${left}개가 남았어요`:'다 나눴어요 ▶'):(left>0?`${left}개 더 내려놓아 주세요`:'내 결과 보기 ▶');
}
$('#rows').innerHTML=IT.map((x,i)=>`<div class="row" id="r${i}"><div><h3>${x.e} ${x.n}</h3><p>${x.d}</p></div><div class="ctl"><button data-i="${i}" data-d="-1" aria-label="빼기">−</button><b>0</b><button data-i="${i}" data-d="1" aria-label="더하기">＋</button></div><div class="mini"></div></div>`).join('');
$('#rows').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const i=+b.dataset.i,d=+b.dataset.d;
  if(v[i]+d<0)return;if(step===1&&d>0&&sum()>=N)return;if(step===2&&d>0&&v[i]>=v0[i])return;if(step===2&&d<0&&sum()<=N-CUT)return;
  v[i]+=d;try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}draw()});
$('#go').addEventListener('click',()=>{
  if(step===1){v0=v.slice();step=2;draw();scrollTo(0,0);document.body.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:260});return}
  const mx=Math.max(...v),top=IT.map((x,i)=>i).filter(i=>v[i]===mx).sort((a,b)=>v0[b]-v0[a]).slice(0,2);
  const cut=IT.map((x,i)=>i).filter(i=>v0[i]>v[i]),zero=IT.map((x,i)=>i).filter(i=>v0[i]===0);
  $('#cards').innerHTML=top.map((i,k)=>{const x=IT[i];return `<div class="card" style="animation-delay:${k*.25}s"><p style="margin:0">${k?'그리고 또 하나':'급할 때 나는'}</p><div class="em">${x.e}</div><h2>${x.ty}</h2><p>끝까지 지킨 것: <b style="color:var(--btn)">${x.n}</b> (${v[i]}코인)</p><div class="q" style="margin-top:12px">💪 힘이 나는 순간<br>${x.up}</div><div class="q">😮‍💨 쉽게 지치는 순간<br>${x.dn}</div><div class="q">🗣 동료에게 부탁하고 싶은 한마디<br>${x.ask}</div></div>`}).join('');
  $('#bars').innerHTML=IT.map((x,i)=>`<div class="bar"><span>${x.e} ${x.n}</span><u><s style="width:0" data-w="${v[i]/N*100}"></s></u><span>${v0[i]}→${v[i]}</span></div>`).join('');
  $('#mv').textContent=cut.length?`돌발 상황에서 먼저 내려놓은 것: ${cut.map(i=>IT[i].n).join(', ')}. 아쉽지만 급하면 양보할 수 있는 것들이에요.`:'';
  $('#qs').innerHTML=(zero.length?`<div class="q">⚠️ 부딪히기 쉬운 장면<br>${zero.slice(0,2).map(i=>IT[i].cl).join('<br>')}</div>`:'<div class="q">처음엔 하나도 버리지 않았네요. 그래서 2개를 내려놓는 순간이 더 어려웠을지도 몰라요.</div>')+'<div class="q">옆 사람은 무엇을 끝까지 지켰을까요? 같은 팀이어도 유형이 다를 수 있습니다.</div><div class="q">이 차이가 어디서 오는지, 오늘 함께 알아봅니다.</div>';
  $('#s1').hidden=true;$('#s2').hidden=false;scrollTo(0,0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.bar s').forEach(s=>s.style.width=s.dataset.w+'%')));
});
$('#again').addEventListener('click',()=>{v=IT.map(()=>0);v0=null;step=1;$('#s2').hidden=true;$('#s1').hidden=false;draw();scrollTo(0,0)});
draw();
</script>
</body>
</html>
