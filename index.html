<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>BFI 성격5요인검사 · 검사·결과지 바로가기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#14171a;--g:#1d4a2c;--sub:#5d646b;--line:#d5d9dc;--bg:#f3f4f2;--err:#b3261e}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);word-break:keep-all;min-height:100dvh;display:flex;justify-content:center}
.wrap{width:100%;max-width:440px;padding:28px 20px 40px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--sub);border-bottom:2px solid var(--ink);padding-bottom:10px}
.brand b{color:var(--g)}
h1{font-size:34px;line-height:1.18;font-weight:900;letter-spacing:-.035em}
h1 small{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
.spec{display:grid;grid-template-columns:repeat(2,1fr);border:1.5px solid var(--ink);background:#fff}
.spec div{padding:12px 8px;text-align:center;border-right:1px solid var(--line)}
.spec div:last-child{border-right:0}
.spec dt{font-size:12px;color:var(--sub);font-weight:600}
.spec dd{font-size:18px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
form{background:#fff;border:1.5px solid var(--ink);padding:20px 18px 18px;display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:7px;font-size:15px;font-weight:800}
label span{font-size:13px;font-weight:500;color:var(--sub)}
input{font:inherit;font-size:20px;font-weight:700;padding:13px 14px;border:1.5px solid var(--line);border-radius:0;background:#fff;color:var(--ink);outline:none;width:100%}
input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(29,74,44,.14)}
input.pin{letter-spacing:.45em;font-variant-numeric:tabular-nums}
button{font:inherit;font-size:18px;font-weight:800;padding:16px;border:0;background:var(--ink);color:#fff;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
.msg{font-size:14px;font-weight:600;line-height:1.5;min-height:21px}
.msg.err{color:var(--err)}
.msg.ok{color:var(--g)}
.go{display:none;text-align:center;font-weight:800;font-size:17px;color:#fff;background:var(--g);padding:15px;text-decoration:none}
ol{list-style:none;counter-reset:n;display:flex;flex-direction:column;gap:9px;font-size:15px;line-height:1.55}
ol li{counter-increment:n;display:grid;grid-template-columns:26px 1fr}
ol li::before{content:counter(n);font-weight:900;color:var(--g)}
h2{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
h2 .tag{font-size:12px;font-weight:800;color:#fff;background:var(--g);padding:3px 8px}
footer{font-size:13px;color:var(--sub);line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
footer b{color:var(--ink)}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand"><span><b>한국가이던스</b> 심리검사 안내</span><span>성인용</span></div>

  <h1>BFI 성격5요인검사<small>내 검사 · 결과지 바로가기</small></h1>

  <dl class="spec">
    <div><dt>문항</dt><dd>160</dd></div>
    <div><dt>소요</dt><dd>약 30분</dd></div>
  </dl>

  <form id="f" autocomplete="off" novalidate>
    <label>이름<input id="nm" name="nm" type="text" inputmode="text" placeholder="홍길동" required></label>
    <label>휴대폰 번호 뒷자리 4자리<span>문자를 받은 번호의 마지막 4자리</span>
      <input id="pn" class="pin" name="pn" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" required></label>
    <button id="btn" type="submit">내 검사 창 열기</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
    <a id="go" class="go" href="#" rel="noreferrer">검사 창으로 이동</a>
  </form>

  <section>
    <h2><span class="tag">검사</span>11월 27일(금)까지</h2>
    <ol>
      <li>조용한 곳에서 한 번에 끝까지 응답</li>
      <li>정답 없음 · 평소의 나와 가까운 쪽 선택</li>
    </ol>
  </section>

  <section>
    <h2><span class="tag">결과지</span>11월 30일(월) 강의 시간</h2>
    <ol>
      <li>활동지 QR로 이 페이지 접속</li>
      <li>이름 + 휴대폰 뒷자리 4자리 입력</li>
      <li>내 검사 창에서 결과지 PDF 다운로드 · 저장</li>
    </ol>
  </section>

  <footer>이름이나 번호가 맞지 않으면 아래로 연락 주세요.<br><b>한국가이던스 신지은</b> 010-4445-8593</footer>
</main>

const $ = (id) => document.getElementById(id);
const dec = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const norm = (s) => s.normalize("NFC").replace(/\s+/g, "");

async function open(name, pin) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(name + pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: dec(DATA.s), iterations: DATA.k, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  for (const e of DATA.e) {
    try {
      const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: dec(e.i) }, key, dec(e.c));
      return JSON.parse(new TextDecoder().decode(pt));
    } catch (_) { /* 다른 사람 항목 */ }
  }
  return null;
}

$("pn").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 4); });

$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const name = norm($("nm").value), pin = $("pn").value;
  const msg = $("msg");
  msg.className = "msg"; $("go").style.display = "none";
  if (!name) { msg.className = "msg err"; msg.textContent = "이름을 입력해 주세요."; return; }
  if (!/^\d{4}$/.test(pin)) { msg.className = "msg err"; msg.textContent = "휴대폰 번호 뒷자리 4자리를 입력해 주세요."; return; }
  $("btn").disabled = true; msg.textContent = "확인 중…";
  let r = null;
  try { r = await open(name, pin); } catch (_) {}
  $("btn").disabled = false;
  if (!r) {
    msg.className = "msg err";
    msg.textContent = "명단에서 찾지 못했어요. 이름(띄어쓰기 없이)과 번호 뒷자리를 다시 확인해 주세요.";
    return;
  }
  msg.className = "msg ok";
  msg.textContent = r.n + "님의 검사 창으로 이동합니다.";
  const go = $("go"); go.href = r.u; go.style.display = "block";
  setTimeout(() => { location.href = r.u; }, 900);
});
</script>
