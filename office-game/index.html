<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>완벽한 송년의 밤 대작전</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* 해 질 녘의 아늑한 사무실: 크림 종이 + 세이지 벽 + 나무 바닥. 채도는 낮게, 글씨는 크게 */
:root{
  --bg:#f3ead9; --paper:#fffaf0; --ink:#3b3228; --dim:#857868; --line:#dccdb4;
  --btn:#c9783f; --btn2:#9c5a2b; --ok:#3f8f6e; --bad:#bd5a55; --gold:#b9852a;
  --disp:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
[hidden]{display:none!important}
.disp{font-family:var(--disp);font-weight:400}
body{word-break:keep-all;overflow-wrap:break-word}h1,h2,h3,p{text-wrap:balance}
.deadtab{position:fixed;inset:0;z-index:999;background:#3b3228ee;color:#fff;display:grid;place-items:center;text-align:center;font-size:2.4em;font-weight:900;line-height:1.6}
.stk{position:relative;height:58px;background:#3b32281f;border-radius:18px;margin:12px 4px;overflow:hidden;flex:none}.stk i{position:absolute;top:0;bottom:0;background:#7fb069;border-radius:12px}.stk u{position:absolute;top:0;bottom:0;width:12px;margin-left:-6px;background:#3b3228;border-radius:6px}.stk.miss{background:#e2726e66;animation:shake .35s}
.says p.urank{white-space:nowrap;overflow:hidden;font-size:1.6em}.urank span{display:inline-block;background:#fffdf6;border:3px solid var(--ink);border-radius:1em;padding:0 .6em;margin:0 .2em}.urank b{color:var(--btn2)}
.sayw{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:.5em .7em;justify-content:center;align-content:center;overflow:hidden;padding:.3em}.sayw .chip{cursor:pointer;background:#fffdf6;border:.16em solid var(--pc);border-radius:1.2em;padding:.18em .75em;font-weight:900;box-shadow:0 .2em 0 #3b322833;max-width:100%}.sayw .chip.new{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}.sayw.s1{font-size:2.3em}.sayw.s2{font-size:1.95em}.sayw.s3{font-size:1.6em}.sayw.s4{font-size:1.3em}
.pbk{font-size:1.4em;position:relative;width:30em;max-width:100%;height:8.3em;margin:0 auto;perspective:55em;perspective-origin:50% 10%}
.pbk .pg{position:absolute;left:.5em;right:.5em;bottom:-.1em;height:8em;border-radius:.5em;transform-origin:50% 100%;transform:rotateX(76deg);background:linear-gradient(90deg,transparent 49.7%,#d6c39c 49.7%,#d6c39c 50.3%,transparent 50.3%),repeating-linear-gradient(0deg,#f6ecd6 0 1.2em,#f1e5cb 1.2em 1.25em);border:.16em solid #e2d2b0;box-shadow:0 1.2em 1.2em #3b322826}
.pbk .ly{position:absolute;bottom:.55em;transform-origin:50% 100%;animation:pbfold .85s cubic-bezier(.25,1.45,.45,1) both;filter:drop-shadow(0 .14em 0 #3b322830)}
@keyframes pbfold{0%{transform:rotateX(-89deg);opacity:0}15%{opacity:1}100%{transform:rotateX(0);opacity:1}}
.pbk .l1{left:2.2em;right:2.2em;height:4.6em;background:#a9cbbb;clip-path:polygon(0 100%,0 58%,7% 40%,15% 56%,23% 30%,33% 54%,43% 20%,50% 34%,57% 20%,67% 54%,77% 30%,85% 56%,93% 40%,100% 58%,100% 100%)}
.pbk .l2a,.pbk .l2b{width:4.4em;height:5.4em;background:linear-gradient(180deg,#7fb069,#5d9147);clip-path:polygon(50% 0,74% 32%,62% 32%,86% 66%,70% 66%,94% 100%,6% 100%,30% 66%,14% 66%,38% 32%,26% 32%);animation-delay:.14s}
.pbk .l2a{left:4.2em}.pbk .l2b{right:4.2em;animation-delay:.2s}
.pbk .l2c,.pbk .l2d{font-size:2.6em;line-height:1;animation-delay:.3s}.pbk .l2c{left:3.2em}.pbk .l2d{right:3.2em;bottom:.5em;animation-delay:.36s}
.pbk .l3{left:50%;margin-left:-4.2em;width:8.4em;height:7.2em;animation-delay:.45s;background:#fffdf6;border:.3em solid #fff;border-top:.5em solid var(--tc);border-radius:.7em;box-shadow:inset 0 0 0 .1em #eadfc6;display:grid;place-items:center}
.pbk .l3 span{font-size:4.6em;line-height:1;white-space:nowrap}
.bnr{font-size:2.2em;letter-spacing:.08em;line-height:1.3;min-height:1.3em}
#world{position:fixed;inset:0;z-index:0;width:100%;height:100%}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
#app{position:relative;z-index:2;height:100%}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(4px,-2px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes flipin{from{opacity:0;rotate:y 90deg}to{opacity:1;rotate:y 0deg}}
@keyframes stamp{0%{transform:scale(3) rotate(-18deg);opacity:0}60%{transform:scale(.9) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.rise{animation:rise .5s both}

/* ---------- 강사 화면 ---------- */
.host{position:absolute;inset:0;font-size:min(1.3vw,2.3vh);pointer-events:none}
.host button,.host .tile,.host [data-wa]{pointer-events:auto}.host [data-wa]{cursor:pointer}
.signs.w3{grid-template-columns:1fr 1fr 1fr;gap:1em}.signs.w3 .sign{grid-template-columns:1fr auto;padding:.6em .9em}.signs.w3 .sign p{font-size:1.5em}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:1em;padding:.7em 1.4em}
.logo,.clock,.roomtag{white-space:nowrap}
.logo{font-family:var(--disp);font-size:2em;color:var(--ink);background:var(--paper);border-radius:.5em;padding:.1em .6em;box-shadow:0 .12em 0 var(--line)}
.clock{font-family:var(--disp);font-size:2em;background:var(--ink);color:#f7e7c4;border-radius:.4em;padding:.1em .6em}
.dots{display:flex;gap:.4em;margin-left:auto}
.dots b{width:2.2em;height:.7em;border-radius:1em;background:#fff8;border:2px solid var(--line)}
.dots b.done{background:var(--ok);border-color:var(--ok)} .dots b.now{background:var(--btn);border-color:var(--btn);animation:pulse 1s infinite}
.roomtag{background:var(--paper);border-radius:.6em;padding:.25em .8em;font-weight:700;font-size:1.35em;box-shadow:0 .12em 0 var(--line)}
.roomtag span{font-family:var(--disp);font-size:1.4em;color:var(--btn2);letter-spacing:.08em}
.next{white-space:nowrap;font-family:var(--disp);font-size:1.9em;background:var(--btn);color:#fff;padding:.25em .9em;border-radius:.5em;box-shadow:0 .2em 0 var(--btn2)}
.next:active{transform:translateY(.15em);box-shadow:0 .05em 0 var(--btn2)}
.ctrl{position:fixed;left:.6em;bottom:.4em;z-index:60;display:flex;gap:.4em;font-size:max(12px,.9em);pointer-events:auto;opacity:.45}
.ctrl.open,.ctrl:hover{opacity:1}.ctrl button:not([data-a=gear]){display:none}.ctrl.open button{display:block}
.ctrl button{background:var(--paper);border:1px solid var(--line);padding:.4em .7em;border-radius:.5em}
.goal{position:absolute;left:1.4em;right:1.4em;top:4.5em;height:2.4em;background:var(--paper);border-radius:1em;border:.14em solid var(--ink);overflow:hidden}
.goal s{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#8fb47a,#e0b45c);transition:width 1.2s cubic-bezier(.2,1,.3,1)}
.goal b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.55em;font-weight:900}
.dlg{position:absolute;left:3%;right:3%;bottom:1.5%;background:var(--paper);border:.22em solid var(--ink);border-radius:1.2em;padding:1em 1.4em 1.1em;display:grid;grid-template-columns:auto 1fr;gap:1.2em;align-items:center;box-shadow:0 .5em 0 #3b322833}
.dlg .who{text-align:center;font-family:var(--disp);font-size:1.5em;color:var(--dim)}
.dlg .who i{display:block;font-style:normal;font-size:3.4em;line-height:1.1}
.dlg .txt{font-size:2.6em;line-height:1.35;font-weight:700;min-height:2.7em}
.dlg .txt small{display:block;font-size:.7em;color:var(--dim);font-weight:500;margin-top:.3em}
.signs{position:absolute;left:3%;right:3%;top:7.7em;display:grid;grid-template-columns:1fr auto 1fr;gap:1.5em;align-items:start}
.sign{background:var(--paper);border:.25em solid var(--oc);border-radius:1.2em;padding:.8em 1.1em;display:grid;grid-template-columns:auto 1fr auto;gap:.8em;align-items:center;box-shadow:0 .4em 0 #3b322822}
.sign .em{font-size:3.2em}
.sign h3{font-family:var(--disp);font-weight:400;font-size:2.7em;color:var(--oc);line-height:1.1}
.sign p{font-size:1.45em;color:var(--dim);font-weight:700;margin-top:.15em}
.sign .cnt{font-family:var(--disp);font-size:4.6em;color:var(--oc);line-height:1}
.sign .cnt small{font-size:.4em}
.sign.win{background:#fff3d6}
.timer{font-family:var(--disp);font-size:4em;min-width:1.9em;height:1.9em;display:grid;place-items:center;background:var(--ink);color:#f7e7c4;border-radius:50%;margin-top:.1em}
.timer.hot{background:var(--bad);animation:pulse .5s infinite}
.popc{position:absolute;left:3%;right:3%;display:flex;flex-wrap:wrap;gap:.7em 1em;justify-content:center;align-content:flex-start;pointer-events:none;z-index:5}
.popc .chip{pointer-events:auto;cursor:pointer;background:#fffdf6;border:.16em solid var(--pc);border-radius:1.2em;padding:.2em .8em;font-size:1.9em;font-weight:900;box-shadow:0 .2em 0 #3b322833}
.popc .chip.new{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}.popc .chip.bump{animation:pulse .4s}.popc .chip b{color:var(--pc)}
.hcards{position:absolute;left:4%;right:4%;top:16.5em;display:flex;gap:2%;justify-content:center;z-index:6}.hcard{flex:1;max-width:46%;background:#fffdf6;border:.2em solid var(--ink);border-radius:1.2em;padding:.7em 1em;font-size:2.3em;font-weight:900;line-height:1.35;box-shadow:0 .3em 0 #3b322833;animation:flipin .7s both}.hcard small{display:block;font-size:.55em;color:var(--btn2)}
.rkrow{position:relative;display:flex;align-items:center;gap:.6em;margin:.35em 0;padding:.4em .8em;border-radius:.6em;background:#3b32280d;font-size:2.1em;font-weight:900;overflow:hidden;animation:rise .6s both}.rkrow i{position:absolute;left:0;top:0;bottom:0;background:var(--btn);opacity:.25}.rkrow>*{position:relative}.rkrow .rn{font-family:var(--disp);color:var(--btn2);min-width:2.2em}.rkrow .rc{margin-left:auto}.rkrow.top{background:#fff3d6;outline:.12em solid var(--btn)}
.satf{position:absolute;left:3%;right:3%;top:19em;bottom:2%;pointer-events:none}.satf span{position:absolute;font-family:var(--disp);font-size:3.4em;color:#fff;background:var(--btn);border-radius:2em;padding:.05em .45em;box-shadow:0 .12em 0 #3b322833;animation:pop .5s both,floaty 3s ease-in-out infinite}.satf span.lo{background:#5f8fbf}.satf span.mid{background:#8f7cba}
.satg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.satg button{padding:14px 0;border-radius:14px;border:3px solid var(--line);background:var(--paper);font-family:var(--disp);font-size:20px}.satg button.on{background:var(--btn);border-color:var(--btn);color:#fff}
.bigq{font-family:var(--disp);font-size:3.6em;text-align:center;color:var(--btn2);margin:.25em 0;animation:pop .7s 1.2s both}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips button{background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:900;font-size:17px}.chips button.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.wrrow{display:flex;gap:8px;margin:6px 0}.wrrow input{flex:1;min-width:0;border:3px solid var(--line);border-radius:14px;padding:10px 12px;font-size:17px;font-family:inherit;background:#fff}.wrrow button{border-radius:14px;background:var(--btn);color:#fff;font-weight:900;padding:0 16px;font-size:17px;border:0}
.pips{position:absolute;left:0;right:0;top:7.4em;display:flex;justify-content:center;font-size:1.9em;font-weight:900}
.pips span{background:var(--paper);border-radius:2em;padding:.15em .9em;box-shadow:0 .1em 0 var(--line)}
.banner{position:absolute;left:0;right:0;top:2.75em;text-align:center;font-family:var(--disp);font-size:2.8em;display:flex;gap:.6em;justify-content:center;align-items:center}
.banner .timer{font-size:1em}
.banner small{font-size:.68em;color:var(--dim);font-family:var(--body);font-weight:700}
.cols{position:absolute;left:2%;right:2%;top:13.2em;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1em;align-items:start}
.tile{background:var(--paper);border-radius:1.1em;padding:.8em 1em;border-top:.5em solid var(--tc);position:relative;box-shadow:0 .4em 0 #3b322822;min-width:0}
.tile h3{font-family:var(--disp);font-weight:400;font-size:2.5em}
.tile .split{font-size:2.1em;font-weight:900;margin-top:.1em}
.tile .cap{font-size:1.6em;color:var(--dim);font-weight:700;margin-top:.2em}
.tile .cap b{color:var(--ink);font-size:1.25em;display:block}
.tile .st{font-family:var(--disp);font-size:2.2em;margin-top:.3em;color:var(--dim)}
.tile .st.ok{color:var(--ok)}
.tile .pick{font-family:var(--disp);font-size:1.55em;line-height:1.2}
.tile .roll{font-family:var(--disp);font-size:3.2em;color:var(--ink);line-height:1.1}
.tile .roll small{font-size:.36em;color:var(--dim);font-family:var(--body);font-weight:700;margin-left:.4em}
.tile .msg{font-size:1.75em;line-height:1.35;font-weight:700;margin-top:.2em}
.tile .delta{font-weight:900;font-size:2em;margin-top:.3em}
.tile .sc{font-family:var(--disp);font-size:3.8em;line-height:1}
.tile .tier{font-family:var(--disp);font-size:2em;color:var(--btn2);margin:.15em 0}
.tile .ttl{font-size:1.3em;color:var(--dim);font-weight:700}
.tile.hit{outline:.3em solid var(--gold);transform:translateY(-.4em)}
.gz{display:flex;gap:.5em;font-size:1.35em;font-weight:900;margin-top:.4em;flex-wrap:wrap;justify-content:inherit}
.gz span{background:#3b32280f;border-radius:.5em;padding:.1em .5em}
.stampx{position:absolute;right:.4em;top:1.5em;font-family:var(--disp);font-size:2em;padding:0 .35em;border:.14em solid;border-radius:.3em;animation:stamp .5s both;background:var(--paper)}
.stampx.ok{color:var(--ok)} .stampx.no{color:var(--bad)}
.plus{color:var(--ok)} .minus{color:var(--bad)}
.evwrap{position:absolute;left:0;right:0;top:7.7em;display:flex;justify-content:center}
.evcard{width:44em;background:#fff3d6;border:.22em solid var(--ink);border-radius:1.4em;padding:1em 1.6em;text-align:center;box-shadow:0 .6em 0 #3b322833;animation:flipin .7s both}
.evcard .em{font-size:5em;line-height:1.1}
.evcard h2{font-family:var(--disp);font-weight:400;font-size:3.6em}
.evcard p{font-size:1.8em;font-weight:700;margin-top:.2em}
.evcard .eff{font-size:2em;font-weight:900;margin-top:.4em;background:#3b322814;border-radius:.5em;padding:.2em}
.strip{position:absolute;left:calc(2% + 2.4em);right:2%;bottom:1.5%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1em}
.strip div{background:var(--paper);border-radius:.8em;padding:.2em .6em;font-weight:900;font-size:1.9em;text-align:center;border-bottom:.25em solid var(--tc);box-shadow:0 .15em 0 #3b322822;white-space:nowrap;transition:transform .2s}
.strip div.hit{transform:translateY(-.5em) scale(1.06);outline:.2em solid var(--gold)}
.cols.hi{top:7.7em}
.tile .gain{font-size:1.5em;font-weight:800;color:var(--dim);margin-top:.25em}.bonus{font-size:.7em;background:var(--gold,#e0b45c);color:#fff;border-radius:.6em;padding:.05em .5em;vertical-align:middle;white-space:nowrap}
.panel{position:absolute;left:8%;right:8%;top:7.7em;background:var(--paper);border:.22em solid var(--ink);border-radius:1.4em;padding:1.1em 1.6em;box-shadow:0 .6em 0 #3b322833}
.panel h2{font-family:var(--disp);font-weight:400;font-size:3em;text-align:center}
.panel .lead{font-size:2em;text-align:center;color:var(--dim);font-weight:700}
.cb{display:grid;grid-template-columns:13em 1fr 3.4em;gap:.8em;align-items:center;font-size:1.9em;font-weight:900;margin-top:.5em}
.cb small{color:var(--dim);font-size:.7em}
.cb u{height:1.3em;background:#3b322814;border-radius:1em;overflow:hidden;text-decoration:none}
.cb u s{display:block;height:100%;width:0;border-radius:1em;transition:width 1.6s cubic-bezier(.2,1,.3,1)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em;margin-top:.6em}
.fact{background:#3b32280d;border-radius:.8em;padding:.6em;text-align:center}
.fact b{display:block;font-family:var(--disp);font-weight:400;font-size:3.2em;color:var(--btn2);line-height:1.1}
.fact span{font-size:1.6em;font-weight:700;color:var(--dim)}
.omap{display:grid;gap:.45em;margin-top:.5em}
.orow{display:grid;grid-template-columns:9.5em 1fr 1.4em 8em 1.4em 1fr;align-items:center;gap:.45em;font-size:1.7em;font-weight:800}
.orow .ot em{font-style:normal;font-size:.62em;background:var(--btn);color:#fff;border-radius:.6em;padding:.1em .5em;margin-left:.5em;vertical-align:middle}.orow .ot em.m{background:#6f8f7a}
.orow .ol{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.orow .or{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow b{font-family:var(--disp);font-size:1.25em}
.ob{display:flex;height:1.25em;border-radius:.7em;overflow:hidden;background:#3b32281f}.ob s{display:block;height:100%}
.ocol{display:flex;gap:.6em;justify-content:center;margin-top:.8em;flex-wrap:wrap}.ocol span{font-size:1.7em;font-weight:800;padding:.2em .8em;border-radius:1em;color:#fff}
.says{margin-top:.7em;display:grid;gap:.45em}
.says p{background:#fff3d6;border-left:.4em solid var(--btn);border-radius:.4em;padding:.25em .8em;font-size:1.85em;font-weight:700;line-height:1.4}
.zlabels{position:absolute;left:2%;right:2%;top:13em;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1em;text-align:center}
.zlabels div{background:var(--paper);border-radius:1em;padding:.4em;font-family:var(--disp);font-size:2.4em;border-bottom:.3em solid var(--zc);box-shadow:0 .2em 0 #3b322822}
.zlabels small{display:block;font-size:.66em;color:var(--dim)}
.qrpanel{position:absolute;left:2.5%;top:5.4em;background:#fff;padding:1em;border-radius:1.4em;border:.22em solid var(--ink);box-shadow:0 .6em 0 #3b322833;text-align:center;width:25em}
.qrpanel svg{width:100%;height:auto;display:block}
.qrpanel p{font-weight:900;font-size:1.8em;margin-top:.3em}
.qrpanel p span{font-family:var(--disp);font-size:1.6em;color:var(--btn2);letter-spacing:.1em}
.lobbytxt{position:absolute;left:calc(2.5% + 27em);right:3%;top:5.2em}
.lobbytxt h1{font-family:var(--disp);font-weight:400;font-size:4.6em;line-height:1.1}
.lobbytxt p{font-size:2.3em;font-weight:700;margin-top:.1em}
.lobbytxt .mini{font-size:1.6em;color:var(--dim);margin-top:.4em}
.mini button{background:var(--paper);border:2px solid var(--line);border-radius:.5em;padding:.1em .7em;font-weight:900}
.rot{display:none;position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--ink);color:#fff;text-align:center;padding:10px;font-size:16px;font-weight:800}
@media (orientation:portrait){.rot{display:block}.host{font-size:1.75vw}}
.toast{position:fixed;left:50%;top:1em;transform:translateX(-50%);z-index:70;background:var(--bad);color:#fff;font-weight:900;padding:.6em 1.2em;border-radius:2em;font-size:20px}

/* ---------- 참가자 폰 ---------- */

var qrcode = function() {

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

          }
        }

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();

      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);

      mapData(_dataCache, maskPattern);

        for (var c = -1; c <= 7; c += 1) {

          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

          pattern = i;
        }
      }

      return pattern;
    };

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);

      for (var i = 0; i < 18; i += 1) {

          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      var maxDcCount = 0;
      var maxEcCount = 0;

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

      mode = mode || 'Byte';

      var newData = null;

      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {

      }
      return _modules[row][col];

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );

    _this.createTableTag = function(cellSize, margin) {

      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';

          qrHtml += '"/>';

      qrHtml += '</tbody>';
      qrHtml += '</table>';
